name: Update Dynamic GitHub Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *" # Daily at 06:00 IST

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update profile data
        run: node scripts/update-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Anas-tec

      - name: Commit updated README
        run: |
          if git diff --quiet -- README.md; then
            echo "No profile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh dynamic GitHub profile"
          git push
